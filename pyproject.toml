[project]
name = "storyteller-agent"
version = "0.1.0"
description = "StoryTellerAgent — cuentos infantiles con Gaia"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "amd-gaia>=0.21.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
storyteller-agent = "story_teller_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_teller_agent"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "story_teller_agent/config"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
