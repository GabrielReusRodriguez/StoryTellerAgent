id: story-teller-agent
name: Story Teller
version: 0.1.0
description: "Story Teller Agent — a GAIA agent (It can tell stories)"
author: Gabriel Reus Rodriguez
license: GPL-3.0

category: general
tags: [storyteller-agent]
icon: sparkles
tools_count: 0

language: python
min_gaia_version: "0.21.2"
models: [Gemma-4-E4B-it-GGUF]

